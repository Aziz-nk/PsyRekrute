name: psyrekrute

services:
  postgres:
    image: postgres:16-alpine
    container_name: psyrekrute_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psyrekrute_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-psyrekrute_db}
    ports:
      # NB : si un PostgreSQL portable tourne deja sur l'hote (port 5432), definir POSTGRES_PORT=5433
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psyrekrute_dev_user} -d ${POSTGRES_DB:-psyrekrute_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [psyrekrute_network]

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: psyrekrute_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_password}
    ports:
      - "${MINIO_PORT_API:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [psyrekrute_network]

  # Cree le bucket prive au premier demarrage (sans lui, tout upload echoue : NoSuchBucket)
  minio-init:
    image: minio/mc:RELEASE.2024-05-03T11-21-07Z
    container_name: psyrekrute_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_DOCUMENTS} &&
      mc anonymous set none local/$${MINIO_BUCKET_DOCUMENTS}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_password}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-psyrekrute-documents}
    networks: [psyrekrute_network]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: psyrekrute_backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    environment:
      NODE_ENV: development
      APP_PORT: 4000
      FRONTEND_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000/api/v1
      # Hote "postgres" = nom du service (jamais localhost depuis un conteneur)
      DATABASE_URL: postgresql://${POSTGRES_USER:-psyrekrute_dev_user}:${POSTGRES_PASSWORD:-dev_secret_change_in_prod}@postgres:5432/${POSTGRES_DB:-psyrekrute_db}?schema=public
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_dev_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_password}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-psyrekrute-documents}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_jwt_access_secret_key_minimum_256_bits_for_testing}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_jwt_refresh_secret_key_minimum_256_bits_for_testing}
      JWT_REFRESH_EXPIRATION: 7d
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    networks: [psyrekrute_network]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: psyrekrute_frontend
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      # URL appelee par le NAVIGATEUR (hote), donc localhost et non le nom de service
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_DEFAULT_LOCALE: fr
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    networks: [psyrekrute_network]

volumes:
  postgres_data:
  minio_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:

networks:
  psyrekrute_network:
    driver: bridge
