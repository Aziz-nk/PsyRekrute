version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: psyrekrute_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psyrekrute_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-psyrekrute_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psyrekrute_dev_user} -d ${POSTGRES_DB:-psyrekrute_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - psyrekrute_network

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: psyrekrute_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_password}
    ports:
      - "${MINIO_PORT_API:-9000}:9000"
      - "${MINIO_PORT_CONSOLE:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psyrekrute_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: psyrekrute_backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-psyrekrute_dev_user}:${POSTGRES_PASSWORD:-dev_secret_change_in_prod}@postgres:5432/${POSTGRES_DB:-psyrekrute_db}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_dev_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_password}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-psyrekrute-documents}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_jwt_access_secret_key_minimum_256_bits_for_testing}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_jwt_refresh_secret_key_minimum_256_bits_for_testing}
      JWT_REFRESH_EXPIRATION: 7d
    ports:
      - "4000:4000"
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - psyrekrute_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: psyrekrute_frontend
    restart: on-failure
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_DEFAULT_LOCALE: fr
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - psyrekrute_network

volumes:
  postgres_data:
  minio_data:

networks:
  psyrekrute_network:
    driver: bridge
