name: psyrekrute-prod

services:
  # ----------------------------------------------------------------------------
  # Base de données relationnelle PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: psyrekrute_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-psyrekrute_prod_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-psyrekrute_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - psyrekrute_prod_network

  # ----------------------------------------------------------------------------
  # Stockage d'objets S3 / MinIO (CV candidats et pièces justificatives ICE)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: psyrekrute_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - psyrekrute_prod_network

  # Initialisation automatique du bucket privé (exécuté une seule fois au boot)
  minio-init:
    image: minio/mc:RELEASE.2024-05-03T11-21-07Z
    container_name: psyrekrute_prod_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_DOCUMENTS:-psyrekrute-documents} &&
      mc anonymous set none local/$${MINIO_BUCKET_DOCUMENTS:-psyrekrute-documents}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-psyrekrute-documents}
    networks:
      - psyrekrute_prod_network

  # ----------------------------------------------------------------------------
  # Backend NestJS (API REST, Auth RBAC, Matching, Workflow)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: psyrekrute_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_PORT: 4000
      FRONTEND_URL: ${PRODUCTION_URL}
      PUBLIC_API_URL: ${PRODUCTION_URL}/api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-psyrekrute_prod_db}?schema=public
      STORAGE_DRIVER: s3
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback,linklocal,uniquelocal}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-psyrekrute-documents}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - psyrekrute_prod_network

  # ----------------------------------------------------------------------------
  # Frontend Next.js (App Router, Standalone, i18n FR/AR/EN)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_DEFAULT_LOCALE: fr
    container_name: psyrekrute_prod_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - psyrekrute_prod_network

  # ----------------------------------------------------------------------------
  # Reverse Proxy Nginx (Terminaison HTTPS, Sécurité, Routage Web/API)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: psyrekrute_prod_nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - certbot_challenge:/var/www/certbot:ro
    networks:
      - psyrekrute_prod_network

volumes:
  postgres_prod_data:
    name: psyrekrute_prod_postgres_data
  minio_prod_data:
    name: psyrekrute_prod_minio_data
  ssl_certs:
    name: psyrekrute_prod_ssl_certs
  certbot_challenge:
    name: psyrekrute_prod_certbot_challenge

networks:
  psyrekrute_prod_network:
    name: psyrekrute_prod_network
    driver: bridge
